<!doctype html>
<html lang="zh-CN" class="no-js" data-language-url="{{ '/en/about/' | relative_url }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>何龙 | Long He</title>
    
    <meta name="description" content="{{ page.excerpt | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" hreflang="zh-CN" href="{{ '/' | absolute_url }}">
    <link rel="alternate" hreflang="en" href="{{ '/en/about/' | absolute_url }}">
    <!-- Base URL for assets -->
    <base href="{{ site.baseurl | default: '' }}/">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ '/images/favicon-zzu.ico' | relative_url }}">
  </head>

  <body>
    <!-- Navigation -->
    {% include masthead.html %}

    <div id="main" role="main">
      <!-- Sidebar -->
      {% include sidebar.html %}
    
      <!-- Main Content -->
      <article class="page" itemscope itemtype="http://schema.org/CreativeWork">
        <div class="page__inner-wrap">
          <section class="page__content" itemprop="text">
            {{ content }}
          </section>
        </div>
      </article>
    </div>

    <!-- Scripts -->
    <script src="{{ '/assets/js/main.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/language-switcher.js' | relative_url }}"></script>
    
    <!-- Analytics -->
    {% include analytics.html %}

  </body>
</html>
